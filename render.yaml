services:
  # ── Backend: FastAPI Python Web Service ──
  - type: web
    name: yogsetu-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: GEMMA_MODEL_ID
        value: gemma-4-31b-it
      - key: DEMO_MODE
        value: "false"
      - key: YOGSETU_DB_URL
        value: sqlite:///./yogsetu.db
      - key: CORS_ORIGINS
        value: "https://yogsetu.onrender.com,https://yogsetu-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.11"

  # ── Frontend: React/Vite Static Site ──
  - type: web
    name: yogsetu-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://yogsetu-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
